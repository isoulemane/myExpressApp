trigger:
  branches:
    include:
    - main
    - develop
    - release/staging
pr:
  branches:
    include:
    - main
pool:
  vmImage: ubuntu-latest
stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build job
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: 20.x
      displayName: Install Node.js
    - task: CmdLine@2
      displayName: Install and Build
      inputs:
        script: |
          npm install
          zip -r myExpressApp.zip .
    - task: ecdc45f6-832d-4ad9-b52b-ee49e94659be@1
      displayName: Publish Artifact
      inputs:
        path: $(System.DefaultWorkingDirectory)/myExpressApp.zip
        artifactName: myExpressApp
- stage: DeployDev
  displayName: Deploy to Dev
  dependsOn:
  - Build
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
  jobs:
  - job: DeployDev
    displayName: Deploy to Dev job
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: current
        downloadType: single
        artifactName: myExpressApp
        downloadPath: $(System.DefaultWorkingDirectory)
    - task: AzureWebApp@1
      inputs:
        azureSubscription: Azure subscription 1 (ca87634b-6f5b-404e-a749-f3bc1723f59d)
        appName: $(devappname)
        package: $(System.DefaultWorkingDirectory)/**/*.zip
        runtimeStack: NODE|20-lts
        startUpCommand: npm start
      displayName: Deploy to Dev Environment
- stage: DeployStaging
  displayName: Deploy to Staging
  dependsOn:
  - Build
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/release/staging')
  jobs:
  - job: DeployStaging
    displayName: Deploy to Staging job
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: current
        downloadType: single
        artifactName: myExpressApp
        downloadPath: $(System.DefaultWorkingDirectory)
    - task: AzureWebApp@1
      inputs:
        azureSubscription: Azure subscription 1 (ca87634b-6f5b-404e-a749-f3bc1723f59d)
        appName: $(stagingappname)
        package: $(System.DefaultWorkingDirectory)/**/*.zip
        runtimeStack: NODE|20-lts
        startUpCommand: npm start
      displayName: Deploy to Staging Environment
- stage: DeployProd
  displayName: Deploy to Production
  dependsOn:
  - Build
  condition: |
    or(eq(variables['Build.SourceBranch'], 'refs/heads/main'),
       eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - job: DeployProd
    displayName: Deploy to Production job
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: current
        downloadType: single
        artifactName: myExpressApp
        downloadPath: $(System.DefaultWorkingDirectory)
    - task: AzureWebApp@1
      inputs:
        azureSubscription: Azure subscription 1 (ca87634b-6f5b-404e-a749-f3bc1723f59d)
        appName: $(prodappname)
        package: $(System.DefaultWorkingDirectory)/**/*.zip
        runtimeStack: NODE|20-lts
        startUpCommand: npm start
      displayName: Deploy to Production Environment
